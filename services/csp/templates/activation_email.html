<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Your Account</title>

<style>
  /* ============ RESET / BASE ============ */
  * {
    box-sizing: border-box;
  }

  table {
    border-collapse: collapse;
    border: 0;
  }

  td {
    padding: 0;
  }

  html, body {
    margin: 0;
    padding: 16px;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: black;
    background-color: #f9fafb;
  }

  /* Gmail strips CSS on <body>, so the same color is set again on .page below */

  a {
    text-decoration: none;
  }

  /* ============ LAYOUT ============ */
  .page {
    width: 100%;
    background-color: #f9fafb;
  }

  .page-cell {
    padding: 40px 16px;
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background-color: white;
    overflow: hidden;
    text-align: left;
  }

  /* ============ HEADER ============ */
  .header {
    background-color: #007aff;
    padding: 32px;
  }

  .logo-badge {
    width: 44px;
    height: 44px;
    background-color: white;
    text-align: center;
    vertical-align: middle;
  }

  .logo-badge span {
    display: inline-block;
    color: #007aff;
    font-size: 18px;
    font-weight: bold;
    line-height: 44px;
  }

  .logo-text {
    padding-left: 12px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .logo-text span {
    color: white;
    font-size: 24px;
  }

  /* ============ BODY ============ */
  .content {
    padding: 40px 32px;
  }

  .content h1 {
    margin: 0 0 14px;
    font-size: 22px;
  }

  .content p {
    margin: 0 0 16px;
    font-size: 15px;
    line-height: 1.6;
    color: #4b5563;
  }

  .content .small-text {
    font-size: 13px;
    text-align: center;
    color: #9ca3af;
  }

  .content .link-fallback {
    font-size: 13px;
    word-break: break-all;
    margin-bottom: 24px;
  }

  /* ============ BUTTON ============ */
  .btn-wrap {
    text-align: center;
    margin: 48px 0;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    font-size: 14px;
    color: white !important;
    background-color: #007aff;
  }

  /* ============ FOOTER ============ */
  .footer {
    background-color: white;
    padding: 36px 32px;
    text-align: center;
  }

  .footer p {
    margin: 0;
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.6;
  }
</style>
</head>

<body>

  <table role="presentation" class="page">
    <tr>
      <td class="page-cell">

        <table role="presentation" class="card">
          <tr>
            <td class="header">
              <table role="presentation">
                <tr>
                  <td class="logo-badge"><span>549</span></td>
                  <td class="logo-text"><span>SYSE 549 Drive</span></td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="content">
              <h1>Confirm your email address</h1>
              <p>Thank you for signing up for SYSE 549 Drive. Click the button below to activate your account.</p>

              <div class="btn-wrap">
                <a href="{{ACTIVATION_URL}}" class="btn">Activate</a>
              </div>

              <p class="small-text">If you did not create an account, you can safely ignore this email.</p>
            </td>
          </tr>

          <tr>
            <td class="footer">
              <p>SYSE 549 Drive<br>430 N College Ave, Fort Collins, CO 80524</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
